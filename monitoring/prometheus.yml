global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'taskqueue-monitor'

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 10s